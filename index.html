<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>ORBITA — Calendário da Família</title>
<meta name="theme-color" content="#0a0e1a">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0a0e1a;
    --bg-panel:#10162a;
    --bg-panel-2:#161d38;
    --line:#2a3363;
    --text:#e8ecf7;
    --text-dim:#8891b5;
    --cyan:#2fe8ff;
    --magenta:#ff3ec9;
    --violet:#8b6bff;
    --amber:#ffb020;
    --green:#3dffb0;
    --radius:14px;
    --font-display:'Space Grotesk', 'Segoe UI', sans-serif;
    --font-body:'Space Grotesk','Segoe UI',sans-serif;
    --font-pixel:'Press Start 2P', monospace;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:var(--font-body);}
  body{
    min-height:100vh;
    background:
      repeating-linear-gradient(115deg, rgba(139,107,255,.05) 0 1px, transparent 1px 46px),
      repeating-linear-gradient(25deg, rgba(47,232,255,.04) 0 1px, transparent 1px 46px),
      radial-gradient(circle at 15% 0%, rgba(139,107,255,.16), transparent 40%),
      radial-gradient(circle at 90% 10%, rgba(47,232,255,.12), transparent 45%),
      var(--bg);
    padding-bottom:88px;
    overflow-x:hidden;
  }
  ::-webkit-scrollbar{display:none;}

  /* ---------- FX (decoração pixel/arcade original) ---------- */
  .top-scene{position:relative;}
  .fx-layer{position:absolute;inset:0;z-index:-1;pointer-events:none;overflow:hidden;}
  .fx{position:absolute;filter:drop-shadow(0 0 5px currentColor);opacity:.8;}
  .fx-cross{width:10px;height:10px;}
  .fx-cross::before,.fx-cross::after{content:'';position:absolute;background:currentColor;}
  .fx-cross::before{left:4px;top:0;width:2px;height:10px;}
  .fx-cross::after{left:0;top:4px;width:10px;height:2px;}
  .fx-gem{width:13px;height:13px;border:2px solid currentColor;border-radius:2px;transform:rotate(45deg);background:rgba(0,0,0,.2);}
  .fx-gem::after{content:'';position:absolute;top:50%;left:50%;width:3px;height:3px;background:currentColor;transform:translate(-50%,-50%);}
  .fx-star{width:15px;height:15px;background:currentColor;clip-path:polygon(50% 0%,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%);}
  .fx-ghost{width:22px;height:22px;image-rendering:pixelated;}

  /* ---------- HEADER ---------- */
  header{
    padding:22px 18px 14px;
    display:flex;align-items:center;justify-content:space-between;
    position:relative;z-index:1;
  }
  .logo{
    font-family:var(--font-pixel);
    font-size:14px;letter-spacing:1px;
    color:var(--cyan);
    text-shadow:0 0 10px rgba(47,232,255,.7);
  }
  .logo span{color:var(--magenta); text-shadow:0 0 10px rgba(255,62,201,.7);}
  .icon-btn{
    width:38px;height:38px;border-radius:50%;
    background:#04070f;border:2px solid var(--cyan);
    box-shadow:0 0 8px rgba(47,232,255,.35);
    display:flex;align-items:center;justify-content:center;
    color:var(--cyan); cursor:pointer;
  }

  /* ---------- PROFILE CHIPS ---------- */
  .profiles{
    display:flex;gap:10px;padding:0 18px 16px;overflow-x:auto;
    position:relative;z-index:1;
  }
  .profile-chip{
    flex:0 0 auto;
    display:flex;align-items:center;gap:8px;
    padding:8px 14px 8px 8px;
    border-radius:999px;
    background:var(--bg-panel);
    border:1px solid var(--line);
    font-size:13px;color:var(--text-dim);
    cursor:pointer;
    transition:.2s;
  }
  .profile-chip .dot{width:22px;height:22px;border-radius:50%;flex:0 0 auto;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:#0a0e1a;}
  .profile-chip.active{color:var(--text); border-color:currentColor; box-shadow:0 0 10px currentColor;}
  .profile-chip.add-chip{border-style:dashed; color:var(--text-dim);}

  /* ---------- HERO / NEXT EVENT ---------- */
  .hero{
    margin:0 18px 18px;
    border-radius:12px;
    padding:20px;
    position:relative;z-index:1;
    overflow:hidden;
    background:linear-gradient(135deg, var(--bg-panel-2), var(--bg-panel));
    border:2px solid var(--magenta);
    box-shadow:0 0 16px rgba(255,62,201,.25), inset 0 0 20px rgba(47,232,255,.06);
  }
  .hero::before{
    content:'';position:absolute;inset:0;
    background:radial-gradient(circle at 100% 0%, rgba(255,62,201,.18), transparent 55%);
    pointer-events:none;
  }
  .hero-loot{position:absolute;top:14px;right:14px;width:88px;height:64px;pointer-events:none;}
  #heroCard{position:relative;padding-right:76px;}
  .hero-label{font-family:var(--font-pixel);font-size:8px;line-height:1.7;letter-spacing:1px;color:var(--text-dim);text-transform:uppercase;}
  .hero-title{font-family:var(--font-display);font-weight:700;font-size:19px;margin:10px 0 4px;line-height:1.3;}
  .hero-meta{font-size:13px;color:var(--text-dim);display:flex;gap:14px;flex-wrap:wrap;margin-top:6px;}
  .hero-countdown{
    margin-top:14px;display:flex;gap:8px;
  }
  .cd-box{
    background:rgba(0,0,0,.25);border:1px solid var(--line);
    border-radius:8px;padding:8px 10px;text-align:center;min-width:52px;
  }
  .cd-box b{display:block;font-family:var(--font-display);font-weight:700;font-size:18px;color:var(--cyan);}
  .cd-box small{font-size:9px;color:var(--text-dim);}
  .hero-empty{color:var(--text-dim);font-size:14px;padding:6px 0;}

  /* ---------- WEEK HEATMAP ---------- */
  .section-label{
    padding:0 18px 10px;font-family:var(--font-pixel);font-size:9px;letter-spacing:1px;
    color:var(--text-dim);text-transform:uppercase;line-height:1.6;
    display:flex;justify-content:space-between;align-items:center;
    position:relative;z-index:1;
  }
  .heatmap{
    display:flex;gap:6px;padding:0 18px 20px;
    position:relative;z-index:1;
  }
  .heat-day{flex:1;text-align:center;}
  .heat-bar{
    height:46px;border-radius:5px;background:var(--bg-panel);
    border:1px solid var(--line);
    display:flex;align-items:flex-end;overflow:hidden;
  }
  .heat-fill{width:100%;border-radius:4px 4px 0 0;transition:.3s;}
  .heat-day span{display:block;font-size:10px;color:var(--text-dim);margin-top:6px;}
  .heat-day.today span{color:var(--cyan);font-weight:700;}

  /* ---------- VIEW TOGGLE ---------- */
  .view-toggle{
    display:flex;margin:0 18px 14px;background:var(--bg-panel);
    border:2px solid var(--violet);border-radius:10px;padding:3px;
    box-shadow:0 0 10px rgba(139,107,255,.25);
  }
  .view-toggle button{
    flex:1;border:none;background:none;color:var(--text-dim);
    font-family:var(--font-body);font-size:13px;padding:9px 0;border-radius:7px;cursor:pointer;
  }
  .view-toggle button.active{background:var(--bg-panel-2);color:var(--cyan);box-shadow:0 0 0 1px var(--cyan);}

  /* ---------- MONTH GRID ---------- */
  .month-nav{display:flex;align-items:center;justify-content:space-between;padding:0 18px 10px;}
  .month-nav .m-title{font-family:var(--font-display);font-weight:700;font-size:15px;letter-spacing:1px;}
  .month-nav button{background:#04070f;border:2px solid var(--line);color:var(--cyan);width:32px;height:32px;border-radius:6px;font-size:15px;cursor:pointer;}
  .grid-wd{display:grid;grid-template-columns:repeat(7,1fr);padding:0 18px;gap:4px;margin-bottom:6px;}
  .grid-wd div{text-align:center;font-size:10px;color:var(--text-dim);}
  .grid-days{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;padding:0 18px 20px;}
  .day-cell{
    aspect-ratio:1/1;border-radius:6px;background:var(--bg-panel);
    border:1px solid var(--line);display:flex;flex-direction:column;
    align-items:center;justify-content:flex-start;padding:5px 2px;
    font-size:12px;color:var(--text-dim);cursor:pointer;position:relative;
  }
  .day-cell.out{opacity:.25;}
  .day-cell.today{border:2px solid var(--cyan);color:var(--cyan);box-shadow:0 0 12px rgba(47,232,255,.4), 0 0 10px rgba(47,232,255,.25) inset;}
  .day-cell .dots{display:flex;gap:2px;margin-top:4px;flex-wrap:wrap;justify-content:center;}
  .day-cell .dots i{width:5px;height:5px;border-radius:50%;display:block;}

  /* ---------- AGENDA LIST ---------- */
  .agenda-list{padding:0 18px 20px;display:flex;flex-direction:column;gap:10px;}
  .ev-card{
    display:flex;gap:12px;align-items:center;
    background:var(--bg-panel);border:1px solid var(--line);
    border-radius:14px;padding:12px;cursor:pointer;
  }
  .ev-date{
    flex:0 0 46px;text-align:center;background:var(--bg-panel-2);
    border-radius:10px;padding:6px 0;
  }
  .ev-date b{display:block;font-family:var(--font-display);font-weight:700;font-size:16px;}
  .ev-date small{font-size:9px;color:var(--text-dim);text-transform:uppercase;}
  .ev-body{flex:1;min-width:0;}
  .ev-title{font-size:14px;margin-bottom:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .ev-sub{font-size:11px;color:var(--text-dim);display:flex;gap:8px;align-items:center;}
  .tag{
    font-size:9px;padding:2px 8px;border-radius:999px;letter-spacing:.5px;text-transform:uppercase;
    border:1px solid currentColor;
  }
  .ev-side{flex:0 0 auto;display:flex;flex-direction:column;align-items:flex-end;gap:2px;}
  .ev-time{font-size:12px;color:var(--text-dim);}
  .empty-state{
    text-align:center;padding:50px 20px;color:var(--text-dim);
  }

  /* ---------- MASCOT (original pixel blip, not derived from any IP) ---------- */
  .mascot{width:64px;height:64px;margin:0 auto 14px;image-rendering:pixelated;}

  /* ---------- FAB ---------- */
  .fab{
    position:fixed;right:20px;bottom:88px;
    width:58px;height:58px;border-radius:50%;
    background:linear-gradient(135deg,var(--cyan),var(--violet));
    border:none;color:#04070f;font-size:26px;font-weight:700;
    box-shadow:0 0 22px rgba(47,232,255,.45), 0 6px 18px rgba(0,0,0,.4);
    cursor:pointer;z-index:40;
  }

  /* ---------- BOTTOM NAV ---------- */
  nav.bottom{
    position:fixed;left:0;right:0;bottom:0;
    background:rgba(16,22,42,.9);backdrop-filter:blur(14px);
    border-top:1px solid var(--line);
    display:flex;justify-content:space-around;padding:10px 0 calc(10px + env(safe-area-inset-bottom));
    z-index:30;
  }
  nav.bottom button{
    background:none;border:none;color:var(--text-dim);font-size:10px;
    display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;
  }
  nav.bottom button.active{color:var(--cyan);}
  nav.bottom svg{width:20px;height:20px;}

  /* ---------- MODAL ---------- */
  .overlay{
    position:fixed;inset:0;background:rgba(4,6,14,.7);backdrop-filter:blur(4px);
    display:none;align-items:flex-end;z-index:100;
  }
  .overlay.show{display:flex;}
  .sheet{
    width:100%;max-height:88vh;overflow-y:auto;
    background:var(--bg-panel);border-radius:16px 16px 0 0;
    border-top:2px solid var(--cyan);
    box-shadow:0 -4px 20px rgba(47,232,255,.2);
    padding:20px 18px calc(24px + env(safe-area-inset-bottom));
    animation:slideup .25s ease-out;
  }
  @keyframes slideup{from{transform:translateY(30px);opacity:0;}to{transform:translateY(0);opacity:1;}}
  .sheet h3{font-family:var(--font-pixel);font-size:12px;margin:0 0 16px;letter-spacing:.5px;color:var(--cyan);}
  .field{margin-bottom:14px;}
  .field label{display:block;font-size:11px;color:var(--text-dim);text-transform:uppercase;letter-spacing:1px;margin-bottom:6px;}
  .field input,.field select,.field textarea{
    width:100%;background:var(--bg-panel-2);border:1px solid var(--line);
    border-radius:10px;padding:11px;color:var(--text);font-family:var(--font-body);font-size:14px;
  }
  .field textarea{resize:vertical;min-height:60px;}
  .row2{display:flex;gap:10px;}
  .row2 .field{flex:1;}
  .chip-select{display:flex;gap:8px;flex-wrap:wrap;}
  .chip-select .opt{
    padding:8px 14px;border-radius:999px;border:1px solid var(--line);
    font-size:12px;color:var(--text-dim);cursor:pointer;background:var(--bg-panel-2);
  }
  .chip-select .opt.sel{color:#04070f;font-weight:600;border-color:transparent;}
  .btn-primary{
    width:100%;padding:14px;border-radius:12px;border:none;
    background:linear-gradient(135deg,var(--cyan),var(--violet));
    color:#04070f;font-weight:700;font-size:14px;cursor:pointer;margin-top:6px;
  }
  .btn-ghost{
    width:100%;padding:12px;border-radius:12px;border:1px solid var(--line);
    background:none;color:var(--text-dim);font-size:13px;cursor:pointer;margin-top:8px;
  }
  .prova-extra{display:none;}
  .prova-extra.show{display:block;}
  .close-x{position:absolute;top:16px;right:18px;color:var(--text-dim);font-size:20px;background:none;border:none;cursor:pointer;}
  .sheet-head{position:relative;}

  /* ---------- SHARE (WHATSAPP) ---------- */
  .ev-share{
    flex:0 0 auto;width:32px;height:32px;border-radius:50%;
    background:var(--bg-panel-2);border:1px solid var(--line);
    display:flex;align-items:center;justify-content:center;color:#3dffb0;cursor:pointer;
  }
  .ev-share svg{width:16px;height:16px;}
  .ev-check{
    flex:0 0 auto;width:22px;height:22px;border-radius:6px;
    border:1px solid var(--line);background:var(--bg-panel-2);
    display:flex;align-items:center;justify-content:center;color:transparent;
  }
  .ev-card.selecting .ev-check{color:transparent;}
  .ev-card.selected .ev-check{background:var(--cyan);border-color:var(--cyan);color:#04070f;}
  .share-bar{
    position:fixed;left:0;right:0;bottom:0;
    background:rgba(16,22,42,.96);backdrop-filter:blur(14px);
    border-top:1px solid var(--line);
    display:none;align-items:center;justify-content:space-between;gap:10px;
    padding:12px 18px calc(12px + env(safe-area-inset-bottom));
    z-index:50;
  }
  .share-bar.show{display:flex;}
  .share-bar span{font-size:13px;color:var(--text-dim);}
  .share-bar .actions{display:flex;gap:8px;}
  .share-bar button{border:none;border-radius:10px;padding:10px 14px;font-size:13px;font-weight:600;cursor:pointer;}
  .share-bar .btn-cancel{background:var(--bg-panel-2);color:var(--text-dim);}
  .share-bar .btn-send{background:#3dffb0;color:#04070f;}

  @media(min-width:600px){
    body{max-width:480px;margin:0 auto;}
  }
</style>
</head>
<body>

<div class="top-scene">
  <div class="fx-layer">
    <div class="fx fx-gem" style="top:8px;right:70px;color:var(--cyan)"></div>
    <div class="fx fx-cross" style="top:6px;right:130px;color:var(--magenta)"></div>
    <div class="fx fx-star" style="top:48px;right:24px;color:var(--magenta)"></div>
    <div class="fx" style="top:36px;left:6px;color:var(--magenta)">
      <svg width="18" height="18" viewBox="0 0 16 16"><path fill="currentColor" d="M8 2 L10 5 L8 8 L6 5 Z M8 8 L10 11 L8 15 L6 11 Z M2 8 L5 6 L8 8 L5 10 Z M8 8 L11 6 L14 8 L11 10 Z"/></svg>
    </div>
    <div class="fx fx-gem" style="top:96px;left:2px;color:var(--violet)"></div>
    <div class="fx fx-cross" style="top:150px;left:36%;color:var(--violet)"></div>
    <div class="fx fx-ghost" style="top:170px;right:8px;color:var(--cyan)">
      <svg viewBox="0 0 16 16" xmlns="http://www.w3.org/2000/svg" width="100%" height="100%">
        <g fill="currentColor"><rect x="4" y="1" width="8" height="1"/><rect x="3" y="2" width="1" height="1"/><rect x="12" y="2" width="1" height="1"/>
        <rect x="2" y="3" width="1" height="8"/><rect x="13" y="3" width="1" height="8"/>
        <rect x="3" y="3" width="10" height="8" fill="#0a0e1a" stroke="currentColor"/>
        <rect x="5" y="6" width="2" height="2"/><rect x="9" y="6" width="2" height="2"/>
        <rect x="3" y="11" width="1" height="2"/><rect x="5" y="11" width="1" height="3"/><rect x="7" y="11" width="1" height="2"/>
        <rect x="9" y="11" width="1" height="3"/><rect x="11" y="11" width="1" height="2"/><rect x="13" y="11" width="1" height="3"/></g>
      </svg>
    </div>
    <div class="fx fx-ghost" style="top:222px;right:64px;color:var(--green);opacity:.55">
      <svg viewBox="0 0 16 16" xmlns="http://www.w3.org/2000/svg" width="100%" height="100%">
        <g fill="currentColor"><rect x="4" y="1" width="8" height="1"/><rect x="3" y="2" width="1" height="1"/><rect x="12" y="2" width="1" height="1"/>
        <rect x="2" y="3" width="1" height="8"/><rect x="13" y="3" width="1" height="8"/>
        <rect x="3" y="3" width="10" height="8" fill="#0a0e1a" stroke="currentColor"/>
        <rect x="5" y="6" width="2" height="2"/><rect x="9" y="6" width="2" height="2"/>
        <rect x="3" y="11" width="1" height="2"/><rect x="5" y="11" width="1" height="3"/><rect x="7" y="11" width="1" height="2"/>
        <rect x="9" y="11" width="1" height="3"/><rect x="11" y="11" width="1" height="2"/><rect x="13" y="11" width="1" height="3"/></g>
      </svg>
    </div>
  </div>

  <header>
    <div class="logo">ÓRB<span>I</span>TA</div>
    <div style="display:flex;gap:8px;">
      <button class="icon-btn" id="btnShareMode" title="Selecionar para enviar por WhatsApp">☑</button>
      <button class="icon-btn" id="btnExport" title="Exportar .ics">⇩</button>
    </div>
  </header>

  <div class="profiles" id="profileBar"></div>

  <div class="hero">
    <div id="heroCard"></div>
    <div class="hero-loot">
      <div class="fx fx-star" style="top:0;right:34px;color:var(--amber);width:13px;height:13px;"></div>
      <div class="fx fx-gem" style="top:2px;right:4px;color:var(--cyan);width:12px;height:12px;"></div>
      <div class="fx fx-cross" style="top:22px;right:44px;color:var(--violet);"></div>
      <div class="fx" style="top:24px;right:6px;color:var(--magenta);width:12px;height:12px;">
        <svg viewBox="0 0 16 16" width="100%" height="100%"><path fill="currentColor" d="M8 14 C3 10 1 7 1 5 C1 3 3 1 5 2 C6.5 2.7 8 5 8 5 C8 5 9.5 2.7 11 2 C13 1 15 3 15 5 C15 7 13 10 8 14 Z"/></svg>
      </div>
      <div class="fx fx-gem" style="top:44px;right:40px;color:var(--green);width:11px;height:11px;"></div>
      <div class="fx" style="top:42px;right:8px;color:var(--amber);width:12px;height:12px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ffe9a8,var(--amber));"></div>
    </div>
  </div>

  <div class="section-label"><span>Carga da semana</span><span id="weekRangeLabel"></span></div>
  <div class="heatmap" id="heatmap"></div>
</div>

<div class="view-toggle">
  <button data-view="month" class="active">Mês</button>
  <button data-view="agenda">Agenda</button>
</div>

<div id="monthView">
  <div class="month-nav">
    <button id="prevMonth">‹</button>
    <div class="m-title" id="monthTitle"></div>
    <button id="nextMonth">›</button>
  </div>
  <div class="grid-wd"><div>D</div><div>S</div><div>T</div><div>Q</div><div>Q</div><div>S</div><div>S</div></div>
  <div class="grid-days" id="gridDays"></div>
</div>

<div id="agendaView" style="display:none;">
  <div class="agenda-list" id="agendaList"></div>
</div>

<button class="fab" id="fabAdd">+</button>

<nav class="bottom">
  <button class="active" data-nav="home">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 11l9-8 9 8M5 10v10h14V10"/></svg>
    Início
  </button>
  <button data-nav="profiles">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 4-6 8-6s8 2 8 6"/></svg>
    Perfis
  </button>
  <button data-nav="provas">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16v16H4z"/><path d="M8 4v16M4 9h4"/></svg>
    Provas
  </button>
</nav>

<div class="share-bar" id="shareBar">
  <span id="shareBarCount">0 selecionados</span>
  <div class="actions">
    <button class="btn-cancel" id="btnShareCancel">Cancelar</button>

<div class="overlay" id="overlayProfile">

<script>
/* ============ DADOS / STORAGE ============ */
const DB_KEY='orbita_data_v1';
const COLORS=['#2fe8ff','#ff3ec9','#8b6bff','#ffb020','#3dffb0','#ff6b6b'];
const CATEGORIES=[
  {id:'prova',label:'Prova',color:'#ffb020'},
  {id:'trabalho',label:'Trabalho',color:'#2fe8ff'},
  {id:'treino',label:'Treino',color:'#3dffb0'},
  {id:'familia',label:'Família',color:'#ff3ec9'},
  {id:'outro',label:'Outro',color:'#8b6bff'},
];

function loadDB(){
  try{
    const raw=localStorage.getItem(DB_KEY);
    if(raw) return JSON.parse(raw);
  }catch(e){}
  return {
    profiles:[
      {id:'p1',name:'Você',color:'#2fe8ff'},
      {id:'p2',name:'Filha',color:'#ff3ec9'}
    ],
    events:[],
    activeProfile:'all'
  };
}
function saveDB(){ localStorage.setItem(DB_KEY, JSON.stringify(state)); }

let state=loadDB();
let currentMonth=new Date(); currentMonth.setDate(1);
let currentView='month';
let editingEventId=null;

/* ============ HELPERS ============ */
function uid(){return 'e'+Date.now()+Math.random().toString(16).slice(2,6);}
function fmtDateISO(d){return d.toISOString().slice(0,10);}
function todayISO(){return fmtDateISO(new Date());}
function parseISO(s){const [y,m,d]=s.split('-').map(Number); return new Date(y,m-1,d);}
function daysBetween(a,b){return Math.round((b-a)/86400000);}
const WEEKDAY_SHORT=['dom','seg','ter','qua','qui','sex','sáb'];
const MONTH_NAMES=['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];

function categoryOf(id){return CATEGORIES.find(c=>c.id===id)||CATEGORIES[4];}
function profileOf(id){return state.profiles.find(p=>p.id===id);}

function visibleEvents(){
  let evs=[...state.events];
  if(state.activeProfile!=='all'){
    evs=evs.filter(e=>e.profileId===state.activeProfile);
  }
  return evs.sort((a,b)=> (a.date+a.time).localeCompare(b.date+b.time));
}

/* ============ RENDER: PROFILE BAR ============ */
function renderProfileBar(){
  const bar=document.getElementById('profileBar');
  bar.innerHTML='';
  const allChip=document.createElement('div');
  allChip.className='profile-chip'+(state.activeProfile==='all'?' active':'');
  allChip.innerHTML=`<div class="dot" style="background:linear-gradient(135deg,#2fe8ff,#ff3ec9)">★</div>Todos`;
  allChip.onclick=()=>{state.activeProfile='all';saveDB();renderAll();};
  bar.appendChild(allChip);

  state.profiles.forEach(p=>{
    const c=document.createElement('div');
    c.className='profile-chip'+(state.activeProfile===p.id?' active':'');
    c.style.color=state.activeProfile===p.id?p.color:'';
    c.innerHTML=`<div class="dot" style="background:${p.color}">${p.name.charAt(0).toUpperCase()}</div>${p.name}`;
    c.onclick=()=>{state.activeProfile=p.id;saveDB();renderAll();};
    bar.appendChild(c);
  });

  const addChip=document.createElement('div');
  addChip.className='profile-chip add-chip';
  addChip.innerHTML='+ Perfil';
  addChip.onclick=()=>openProfileModal();
  bar.appendChild(addChip);
}

/* ============ RENDER: HERO / NEXT EVENT ============ */
function renderHero(){
  const hero=document.getElementById('heroCard');
  const now=new Date();
  const upcoming=visibleEvents().filter(e=>{
    const d=parseISO(e.date);
    if(e.time){ const [h,m]=e.time.split(':').map(Number); d.setHours(h,m);} else d.setHours(23,59);
    return d>=now;
  });
  if(upcoming.length===0){
    hero.innerHTML=`<div class="hero-label">Próximo compromisso</div><div class="hero-empty">Nada agendado. Toque em + para adicionar o primeiro compromisso.</div>`;
    return;
  }
  const ev=upcoming[0];
  const cat=categoryOf(ev.category);
  const prof=profileOf(ev.profileId);
  const evDate=parseISO(ev.date);
  const diff=Math.max(0,daysBetween(new Date(now.getFullYear(),now.getMonth(),now.getDate()), evDate));
  let extra='';
  if(ev.category==='prova' && ev.materia){
    extra=`<div class="hero-meta"><span>📘 ${ev.materia}</span>${ev.peso?`<span>⚖ ${ev.peso}</span>`:''}</div>`;
  }
  hero.innerHTML=`
    <div class="hero-label">Próximo compromisso · ${prof?prof.name:''}</div>
    <div class="hero-title">${ev.title}</div>
    <div class="hero-meta">
      <span style="color:${cat.color}">● ${cat.label}</span>
      <span>${evDate.toLocaleDateString('pt-BR',{day:'2-digit',month:'short'})}${ev.time?' às '+ev.time:''}</span>
    </div>
    ${extra}
    <div class="hero-countdown">
      <div class="cd-box"><b>${diff}</b><small>DIAS</small></div>
    </div>
  `;
  hero.onclick=()=>openEventModal(ev.id);
}

/* ============ RENDER: HEATMAP (semana atual) ============ */
function renderHeatmap(){
  const el=document.getElementById('heatmap');
  el.innerHTML='';
  const now=new Date();
  const startOfWeek=new Date(now); startOfWeek.setDate(now.getDate()-now.getDay());
  const counts=[];
  for(let i=0;i<7;i++){
    const d=new Date(startOfWeek); d.setDate(startOfWeek.getDate()+i);
    const iso=fmtDateISO(d);
    const n=visibleEvents().filter(e=>e.date===iso).length;
    counts.push({d,iso,n});
  }
  const max=Math.max(1,...counts.map(c=>c.n));
  document.getElementById('weekRangeLabel').textContent =
    startOfWeek.toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit'}) + ' – ' +
    new Date(startOfWeek.getFullYear(),startOfWeek.getMonth(),startOfWeek.getDate()+6).toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit'});

  counts.forEach(c=>{
    const wrap=document.createElement('div');
    wrap.className='heat-day'+(c.iso===todayISO()?' today':'');
    const pct=Math.round((c.n/max)*100);
    let color='var(--cyan)';
    if(c.n===0) color='var(--line)';
    else if(c.n>=max) color='var(--magenta)';
    wrap.innerHTML=`<div class="heat-bar"><div class="heat-fill" style="height:${c.n===0?6:pct}%;background:${color};"></div></div><span>${WEEKDAY_SHORT[c.d.getDay()]}</span>`;
    el.appendChild(wrap);
  });
}

/* ============ RENDER: MONTH GRID ============ */
function renderMonth(){
  document.getElementById('monthTitle').textContent = `${MONTH_NAMES[currentMonth.getMonth()]} ${currentMonth.getFullYear()}`;
  const grid=document.getElementById('gridDays');
  grid.innerHTML='';
  const firstDay=new Date(currentMonth.getFullYear(),currentMonth.getMonth(),1);
  const startOffset=firstDay.getDay();
  const daysInMonth=new Date(currentMonth.getFullYear(),currentMonth.getMonth()+1,0).getDate();
  const daysInPrev=new Date(currentMonth.getFullYear(),currentMonth.getMonth(),0).getDate();

  const cells=[];
  for(let i=startOffset-1;i>=0;i--) cells.push({day:daysInPrev-i,out:true,month:currentMonth.getMonth()-1});
  for(let d=1;d<=daysInMonth;d++) cells.push({day:d,out:false,month:currentMonth.getMonth()});
  while(cells.length%7!==0 || cells.length<35) cells.push({day:cells.length-startOffset-daysInMonth+1,out:true,month:currentMonth.getMonth()+1});

  cells.forEach(c=>{
    const realMonth=((c.month%12)+12)%12;
    const realYear=currentMonth.getFullYear()+Math.floor(c.month/12)-(c.month<0?1:0);
    const iso=fmtDateISO(new Date(realYear,realMonth,c.day));
    const cell=document.createElement('div');
    cell.className='day-cell'+(c.out?' out':'')+(iso===todayISO()?' today':'');
    const dayEvents=visibleEvents().filter(e=>e.date===iso);
    const dotsHtml=dayEvents.slice(0,4).map(e=>`<i style="background:${categoryOf(e.category).color}"></i>`).join('');
    cell.innerHTML=`${c.day}<div class="dots">${dotsHtml}</div>`;
    cell.onclick=()=>openDayView(iso);
    grid.appendChild(cell);
  });
}

/* ============ RENDER: AGENDA LIST ============ */
function renderAgenda(){
  const list=document.getElementById('agendaList');
  const evs=visibleEvents();
  if(evs.length===0){
    list.innerHTML=`
      <div class="empty-state">
        <svg class="mascot" viewBox="0 0 16 16" xmlns="http://www.w3.org/2000/svg">
          <rect width="16" height="16" fill="none"/>
          <g fill="#2fe8ff">
            <rect x="4" y="1" width="8" height="1"/><rect x="3" y="2" width="1" height="1"/><rect x="12" y="2" width="1" height="1"/>
            <rect x="2" y="3" width="1" height="8"/><rect x="13" y="3" width="1" height="8"/>
            <rect x="3" y="3" width="10" height="8" fill="#0a0e1a" stroke="#2fe8ff"/>
            <rect x="5" y="6" width="2" height="2"/><rect x="9" y="6" width="2" height="2"/>
            <rect x="3" y="11" width="1" height="2"/><rect x="5" y="11" width="1" height="3"/><rect x="7" y="11" width="1" height="2"/>
            <rect x="9" y="11" width="1" height="3"/><rect x="11" y="11" width="1" height="2"/><rect x="13" y="11" width="1" height="3"/>
          </g>
        </svg>
        Nenhum compromisso ainda.<br>Toque em + para começar.
      </div>`;
    return;
  }
  list.innerHTML='';
  evs.forEach(ev=>{
    const cat=categoryOf(ev.category);
    const prof=profileOf(ev.profileId);
    const d=parseISO(ev.date);
    const card=document.createElement('div');
    card.className='ev-card'+(selectionMode?' selecting':'')+(selectedIds.has(ev.id)?' selected':'');
    card.innerHTML=`
      ${selectionMode?`<div class="ev-check">✓</div>`:''}
      <div class="ev-date" style="color:${cat.color}"><b>${String(d.getDate()).padStart(2,'0')}</b><small>${d.toLocaleDateString('pt-BR',{month:'short'})}</small></div>
      <div class="ev-body">
        <div class="ev-title">${ev.title}</div>
        <div class="ev-sub"><span class="tag" style="color:${cat.color}">${cat.label}</span>${prof?prof.name:''}</div>
      </div>
      <div class="ev-side">
        <div class="ev-time">${ev.time||''}</div>
      </div>
      ${selectionMode?'':`<div class="ev-share" title="Enviar por WhatsApp">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2a10 10 0 0 0-8.5 15.2L2 22l4.9-1.3A10 10 0 1 0 12 2zm0 18.2a8.2 8.2 0 0 1-4.2-1.2l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 1 1 12 20.2zm4.5-6.1c-.2-.1-1.5-.7-1.7-.8-.2-.1-.4-.1-.6.1-.2.2-.7.8-.8.9-.1.2-.3.2-.5.1-.2-.1-1-.4-1.9-1.2-.7-.6-1.2-1.4-1.3-1.6-.1-.2 0-.4.1-.5.1-.1.2-.3.4-.4.1-.1.2-.2.2-.4.1-.1 0-.3 0-.4 0-.1-.6-1.5-.8-2-.2-.5-.4-.4-.6-.4h-.5c-.2 0-.4.1-.6.3-.2.2-.8.8-.8 2s.8 2.3.9 2.5c.1.2 1.6 2.4 3.8 3.4.5.2.9.4 1.3.5.5.2 1 .1 1.4.1.4-.1 1.5-.6 1.7-1.2.2-.6.2-1.1.1-1.2-.1-.1-.2-.2-.4-.3z"/></svg>
      </div>`}
    `;
    if(selectionMode){
      card.onclick=()=>{
        if(selectedIds.has(ev.id)) selectedIds.delete(ev.id); else selectedIds.add(ev.id);
        renderAgenda();
        updateShareBar();
      };
    }else{
      card.onclick=()=>openEventModal(ev.id);
      card.querySelector('.ev-share').onclick=(e)=>{ e.stopPropagation(); shareEventsWhatsApp([ev]); };
    }
    list.appendChild(card);
  });
}

/* ============ COMPARTILHAR VIA WHATSAPP ============ */
let selectionMode=false;
let selectedIds=new Set();

function formatEventForShare(ev){
  const cat=categoryOf(ev.category);
  const prof=profileOf(ev.profileId);
  const d=parseISO(ev.date);
  const dataFmt=d.toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit',year:'numeric'});
  let linhas=[`📅 *${ev.title}*`, `🗓 ${dataFmt}${ev.time?' às '+ev.time:''}`, `🏷 ${cat.label}${prof?' · '+prof.name:''}`];
  if(ev.category==='prova' && ev.materia) linhas.push(`📘 ${ev.materia}${ev.peso?' ('+ev.peso+')':''}`);
  if(ev.notes) linhas.push(`📝 ${ev.notes}`);
  return linhas.join('\n');
}

function shareEventsWhatsApp(events){
  if(!events.length) return;
  let texto;
  if(events.length===1){
    texto=formatEventForShare(events[0]);
  }else{
    const ordenados=[...events].sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time));
    texto='📋 *Compromissos — Órbita*\n\n'+ordenados.map(formatEventForShare).join('\n\n');
  }
  const url='https://wa.me/?text='+encodeURIComponent(texto);
  window.open(url,'_blank');
}

function updateShareBar(){
  document.getElementById('shareBarCount').textContent=
    selectedIds.size+(selectedIds.size===1?' selecionado':' selecionados');
}

document.getElementById('btnShareMode').onclick=()=>{
  selectionMode=true;
  selectedIds=new Set();
  document.querySelector('.view-toggle button[data-view="agenda"]').click();
  document.getElementById('shareBar').classList.add('show');
  updateShareBar();
  renderAgenda();
};
document.getElementById('btnShareCancel').onclick=()=>{
  selectionMode=false;
  selectedIds=new Set();
  document.getElementById('shareBar').classList.remove('show');
  renderAgenda();
};
document.getElementById('btnShareSend').onclick=()=>{
  const chosen=state.events.filter(e=>selectedIds.has(e.id));
  if(chosen.length===0){ alert('Selecione ao menos um compromisso.'); return; }
  shareEventsWhatsApp(chosen);
};

function renderAll(){
  renderProfileBar();
  renderHero();
  renderHeatmap();
  renderMonth();
  renderAgenda();
}

/* ============ VIEW TOGGLE ============ */
document.querySelectorAll('.view-toggle button').forEach(btn=>{
  btn.onclick=()=>{
    document.querySelectorAll('.view-toggle button').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    currentView=btn.dataset.view;
    document.getElementById('monthView').style.display = currentView==='month'?'block':'none';
    document.getElementById('agendaView').style.display = currentView==='agenda'?'block':'none';
  };
});
document.getElementById('prevMonth').onclick=()=>{currentMonth.setMonth(currentMonth.getMonth()-1);renderMonth();};
document.getElementById('nextMonth').onclick=()=>{currentMonth.setMonth(currentMonth.getMonth()+1);renderMonth();};

function openDayView(iso){
  document.querySelector('.view-toggle button[data-view="agenda"]').click();
  openEventModal(null, iso);
}

/* ============ MODAL: EVENTO ============ */
const overlayEvent=document.getElementById('overlayEvent');
function buildSelectors(){
  const spWrap=document.getElementById('selProfile');
  spWrap.innerHTML='';
  state.profiles.forEach(p=>{
    const o=document.createElement('div');
    o.className='opt';
    o.textContent=p.name;
    o.dataset.id=p.id;
    o.onclick=()=>{spWrap.querySelectorAll('.opt').forEach(x=>{x.classList.remove('sel');x.style.background='';});o.classList.add('sel');o.style.background=p.color;};
    spWrap.appendChild(o);
  });
  const scWrap=document.getElementById('selCategory');
  scWrap.innerHTML='';
  CATEGORIES.forEach(c=>{
    const o=document.createElement('div');
    o.className='opt';
    o.textContent=c.label;
    o.dataset.id=c.id;
    o.onclick=()=>{
      scWrap.querySelectorAll('.opt').forEach(x=>{x.classList.remove('sel');x.style.background='';});
      o.classList.add('sel'); o.style.background=c.color;
      document.getElementById('provaExtra').classList.toggle('show', c.id==='prova');
    };
    scWrap.appendChild(o);
  });
}

function openEventModal(eventId, prefillDate){
  buildSelectors();
  editingEventId=eventId;
  document.getElementById('btnDeleteEvent').style.display = eventId?'block':'none';
  if(eventId){
    const ev=state.events.find(e=>e.id===eventId);
    document.getElementById('fTitle').value=ev.title;
    document.getElementById('fDate').value=ev.date;
    document.getElementById('fTime').value=ev.time||'';
    document.getElementById('fNotas').value=ev.notes||'';
    document.getElementById('fMateria').value=ev.materia||'';
    document.getElementById('fPeso').value=ev.peso||'';
    document.getElementById('fLembrete').value=ev.lembrete||'';
    document.querySelector(`#selProfile .opt[data-id="${ev.profileId}"]`)?.click();
    document.querySelector(`#selCategory .opt[data-id="${ev.category}"]`)?.click();
  }else{
    document.getElementById('fTitle').value='';
    document.getElementById('fDate').value=prefillDate||todayISO();
    document.getElementById('fTime').value='';
    document.getElementById('fNotas').value='';
    document.getElementById('fMateria').value='';
    document.getElementById('fPeso').value='';
    document.getElementById('fLembrete').value='';
    if(state.activeProfile!=='all') document.querySelector(`#selProfile .opt[data-id="${state.activeProfile}"]`)?.click();
    document.querySelector('#selCategory .opt[data-id="outro"]').click();
  }
  overlayEvent.classList.add('show');
}

document.getElementById('btnSaveEvent').onclick=()=>{
  const title=document.getElementById('fTitle').value.trim();
  const date=document.getElementById('fDate').value;
  const profileSel=document.querySelector('#selProfile .opt.sel');
  const categorySel=document.querySelector('#selCategory .opt.sel');
  if(!title||!date||!profileSel||!categorySel){
    alert('Preencha título, data, perfil e categoria.');
    return;
  }
  const data={
    id: editingEventId||uid(),
    title, date,
    time: document.getElementById('fTime').value,
    profileId: profileSel.dataset.id,
    category: categorySel.dataset.id,
    notes: document.getElementById('fNotas').value,
    materia: document.getElementById('fMateria').value,
    peso: document.getElementById('fPeso').value,
    lembrete: document.getElementById('fLembrete').value
  };
  if(editingEventId){
    const idx=state.events.findIndex(e=>e.id===editingEventId);
    state.events[idx]=data;
  }else{
    state.events.push(data);
  }
  saveDB();
  overlayEvent.classList.remove('show');
  renderAll();
};

document.getElementById('btnDeleteEvent').onclick=()=>{
  if(!editingEventId) return;
  if(!confirm('Excluir este compromisso?')) return;
  state.events=state.events.filter(e=>e.id!==editingEventId);
  saveDB();
  overlayEvent.classList.remove('show');
  renderAll();
};

/* ============ MODAL: PERFIL ============ */
const overlayProfile=document.getElementById('overlayProfile');
function openProfileModal(){
  document.getElementById('pName').value='';
  const wrap=document.getElementById('selColor');
  wrap.innerHTML='';
  COLORS.forEach(c=>{
    const o=document.createElement('div');
    o.className='opt';
    o.style.width='28px';o.style.height='28px';o.style.padding='0';o.style.background=c;o.dataset.color=c;
    o.onclick=()=>{wrap.querySelectorAll('.opt').forEach(x=>x.style.boxShadow='');o.style.boxShadow='0 0 0 2px #fff';};
    wrap.appendChild(o);
  });
  overlayProfile.classList.add('show');
}
document.getElementById('btnSaveProfile').onclick=()=>{
  const name=document.getElementById('pName').value.trim();
  const colorEl=document.querySelector('#selColor .opt[style*="box-shadow"]') || document.querySelector('#selColor .opt');
  if(!name){alert('Digite um nome.');return;}
  state.profiles.push({id:uid(),name,color:colorEl.dataset.color});
  saveDB();
  overlayProfile.classList.remove('show');
  renderAll();
};

/* ============ NAV / FAB / CLOSE ============ */
document.getElementById('fabAdd').onclick=()=>openEventModal(null);
document.querySelectorAll('[data-close]').forEach(b=>{
  b.onclick=()=>document.getElementById(b.dataset.close).classList.remove('show');
});
document.querySelectorAll('.overlay').forEach(ov=>{
  ov.addEventListener('click',(e)=>{ if(e.target===ov) ov.classList.remove('show'); });
});
document.querySelectorAll('nav.bottom button').forEach(b=>{
  b.onclick=()=>{
    document.querySelectorAll('nav.bottom button').forEach(x=>x.classList.remove('active'));
    b.classList.add('active');
    if(b.dataset.nav==='profiles') openProfileModal();
    if(b.dataset.nav==='provas'){
      document.querySelector('.view-toggle button[data-view="agenda"]').click();
    }
  };
});

/* ============ EXPORT .ICS ============ */
document.getElementById('btnExport').onclick=()=>{
  const evs=visibleEvents();
  if(evs.length===0){alert('Nenhum compromisso para exportar.');return;}
  let ics='BEGIN:VCALENDAR\r\nVERSION:2.0\r\nPRODID:-//Orbita//PT-BR//EN\r\n';
  evs.forEach(ev=>{
    const dt=ev.date.replace(/-/g,'') + (ev.time? 'T'+ev.time.replace(':','')+'00' : 'T090000');
    ics += 'BEGIN:VEVENT\r\n';
    ics += 'UID:'+ev.id+'@orbita\r\n';
    ics += 'DTSTART:'+dt+'\r\n';
    ics += 'SUMMARY:'+ev.title.replace(/\n/g,' ')+'\r\n';
    if(ev.notes) ics += 'DESCRIPTION:'+ev.notes.replace(/\n/g,' ')+'\r\n';
    ics += 'END:VEVENT\r\n';
  });
  ics += 'END:VCALENDAR';
  const blob=new Blob([ics],{type:'text/calendar'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url; a.download='orbita-calendario.ics'; a.click();
  URL.revokeObjectURL(url);
};

/* ============ INIT ============ */
renderAll();

/* ============ PWA SW REGISTER ============ */
if('serviceWorker' in navigator){
  window.addEventListener('load',()=>{
    navigator.serviceWorker.register('sw.js').catch(()=>{});
  });
}
